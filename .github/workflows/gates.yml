name: Gates

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A pull request run cancels its superseded runs.
# Every other run gets a unique group, so runs on master never cancel or displace each other.
concurrency:
  group: gates-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: Windows gates
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0

      - name: Install the locked Zig compiler
        run: node tools/fairpane.mjs install-zig

      - name: Run gate repo-check
        run: node tools/fairpane.mjs run repo-check

      - name: Run gate controller-test
        run: node tools/fairpane.mjs run controller-test

      - name: Run gate zig-fmt
        run: node tools/fairpane.mjs run zig-fmt

      - name: Run gate zig-test
        run: node tools/fairpane.mjs run zig-test

      - name: Run gate zig-build
        run: node tools/fairpane.mjs run zig-build

      - name: Run gate c-abi
        run: node tools/fairpane.mjs run c-abi

      - name: Upload the gate receipts and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-gate-receipts-unsigned-local-integrity-records-not-attestations
          path: out/evidence/
          if-no-files-found: error

  linux:
    name: Linux gates
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0

      - name: Install the locked Zig compiler
        run: node tools/fairpane.mjs install-zig

      - name: Run gate repo-check
        run: node tools/fairpane.mjs run repo-check

      - name: Run gate controller-test
        run: node tools/fairpane.mjs run controller-test

      - name: Run gate cross-windows-x86_64
        run: node tools/fairpane.mjs run cross-windows-x86_64

      - name: Run gate cross-linux-aarch64
        run: node tools/fairpane.mjs run cross-linux-aarch64

      - name: Run gate cross-macos-aarch64
        run: node tools/fairpane.mjs run cross-macos-aarch64

      - name: Upload the gate receipts and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-gate-receipts-unsigned-local-integrity-records-not-attestations
          path: out/evidence/
          if-no-files-found: error
